# nginx site config for the Verant app on a Hostinger VPS.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/verant
#   sudo ln -s /etc/nginx/sites-available/verant /etc/nginx/sites-enabled/verant
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (certbot rewrites this file to add the 443 block and redirect):
#   sudo certbot --nginx -d verantintel.com -d www.verantintel.com

upstream verant_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Canonical host: send www to the bare domain in one hop.
server {
    listen 80;
    listen [::]:80;
    server_name www.verantintel.com;
    return 301 http://verantintel.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name verantintel.com;

    # Uploads are small; this only needs to cover the pilot form.
    client_max_body_size 2M;

    # Next.js pre-compresses nothing at runtime, so let nginx handle it.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Build assets are content-hashed, so they can be cached forever.
    location /_next/static/ {
        proxy_pass http://verant_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Files served straight out of public/.
    location /uploads/ {
        proxy_pass http://verant_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://verant_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Keep-alive to the upstream needs an empty Connection header.
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
